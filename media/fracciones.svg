<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 740 250"><title id="title">Sumar fracciones con piezas iguales</title><desc id="desc">Un medio equivale a tres sextos, un tercio a dos sextos. La suma es cinco sextos.</desc><rect width="740" height="250" fill="#f5f8fb"/><g fill="#13263c" font-family="sans-serif" font-size="22"><text x="25" y="35">1/2 + 1/3 = 3/6 + 2/6 = 5/6</text><text x="25" y="90">3/6</text><text x="25" y="145">2/6</text><text x="25" y="205">5/6</text></g><g stroke="#173e66"><rect width="540" height="35" x="120" y="60" fill="#fff"/><rect width="270" height="35" x="120" y="60" fill="#266da2"/><rect width="540" height="35" x="120" y="115" fill="#fff"/><rect width="180" height="35" x="120" y="115" fill="#be5c0b"/><rect width="540" height="35" x="120" y="175" fill="#fff"/><rect width="450" height="35" x="120" y="175" fill="#26715e"/><path d="M210 60v35M210 115v35M210 175v35"/><path d="M300 60v35M300 115v35M300 175v35"/><path d="M390 60v35M390 115v35M390 175v35"/><path d="M480 60v35M480 115v35M480 175v35"/><path d="M570 60v35M570 115v35M570 175v35"/></g></svg>