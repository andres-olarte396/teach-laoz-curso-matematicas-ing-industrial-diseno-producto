<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" role="img" aria-labelledby="title desc"><title id="title">Triángulo rectángulo 3–4–5</title><desc id="desc">Ángulo theta junto al cateto tres. Opuesto cuatro, hipotenusa cinco. Seno cuatro quintos, coseno tres quintos y tangente cuatro tercios.</desc><rect width="740" height="440" fill="#f5f8fb"/><path d="M80 350H320V30Z" fill="#e6f0f7" stroke="#173e66" stroke-width="3"/><path d="M300 350v-20h20" fill="none" stroke="#173e66"/><g font-family="sans-serif" fill="#13263c" font-size="20"><text x="140" y="385">Adyacente = 3</text><text x="335" y="190">Opuesto = 4</text><text x="94" y="180">h = 5</text><text x="103" y="337">θ</text><text x="440" y="265">sin θ = 4/5 = 0,8</text><text x="440" y="300">cos θ = 3/5 = 0,6</text><text x="440" y="335">tan θ = 4/3 ≈ 1,3333</text><text x="25" y="425">3² + 4² = 5² · θ ≈ 53,13° · calculadora en DEG</text></g></svg>
